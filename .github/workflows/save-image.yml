name: Save Go Image Offline
on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull official image from Docker Hub
        run: |
          docker pull golang:1.25-bookworm
          
      - name: Save and compress image
        run: |
          # 保存为 tar 并用 gzip 压缩，减小 Artifact 体积
          docker save golang:1.25-bookworm | gzip > golang-1.25-bookworm.tar.gz
          
      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: golang-offline-package
          path: golang-1.25-bookworm.tar.gz
          retention-days: 7 # 保留7天
