name: Fetch KubeRay Rollback Images
on:
  workflow_dispatch: # 允许手动触发

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取回退版本的镜像
        run: |
          echo "正在拉取 Go 1.24 编译镜像..."
          docker pull golang:1.24.0-bullseye
          
          echo "正在拉取 Distroless base 运行镜像..."
          docker pull gcr.io/distroless/base-debian12:nonroot
          
      - name: 2. 合并打包并极限压缩
        run: |
          # 将两个镜像打包到同一个 tar 文件中，并用 gzip 压缩
          docker save \
            golang:1.24.0-bullseye \
            gcr.io/distroless/base-debian12:nonroot \
            | gzip > kuberay-rollback-images.tar.gz
            
          ls -lh kuberay-rollback-images.tar.gz
          
      - name: 3. 上传至 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuberay-offline-package
          path: kuberay-rollback-images.tar.gz
          retention-days: 3
